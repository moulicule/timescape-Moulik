<!DOCTYPE html>
<html lang="en">

<head>
  <script src="vendor/p5-1.11.11.min.js"></script>
  <script src="vendor/ml5-1.4.0.min.js"></script>



  <link rel="stylesheet" type="text/css" href="style.css">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timescape — Tesseract Control</title>

</head>

<body>
  <div id="hud">
    <div id="info-panel">
      <h1>TESSERACT CONTROL</h1>
      <div class="status-row">
        <span class="label">SYSTEM STATUS:</span>
        <span id="model-status" class="value">INITIALIZING...</span>
      </div>
      <div id="controls">
        <div class="control-item">
          <span class="key">1 HAND</span>
          <span class="desc">Rotate X/Y</span>
        </div>
        <div class="control-item">
          <span class="key">2 HANDS</span>
          <span class="desc">Zoom & Twist</span>
        </div>
        <div class="control-item">
          <span class="key">S</span>
          <span class="desc">Snapshot Mode</span>
        </div>
        <div class="control-item">
          <span class="key">D</span>
          <span class="desc">Toggle HUD</span>
        </div>
      </div>
      <div id="recording-indicator" class="hidden">
        <div class="dot"></div>
        <span>RECORDING</span>
      </div>
    </div>


  </div>

  <main>
  </main>
  <script src="sketch.js"></script>
</body>

</html>
